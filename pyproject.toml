[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nebula-wind-pipeline"
version = "0.1.0"
description = "PySpark proof-of-concept pipeline for wind-turbine telemetry"
requires-python = ">=3.10,<3.12"
dependencies = [
    "pyspark==3.5.1",
    "delta-spark==3.2.0",
]

[project.optional-dependencies]
dev = ["pytest==8.3.5"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
